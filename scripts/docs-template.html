<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>/* @@THEME_SCRIPT@@ */</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>IcoMo — Icon Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script>/* @@ICONS_DATA@@ */</script>
  <style>
    /* Site colors come from the shared chrome stylesheet below. */
    :root {
      --bg: var(--site-bg);
      --fg: var(--site-fg);
      --fg-muted: var(--site-muted);
      --divider: var(--site-divider);
    }

    /* ── Reset / base ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection {
      background: var(--divider);
      color: inherit;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 12px;
      line-height: 16px;
      min-height: 100dvh;
    }

    /* ── Search ──────────────────────────────────────────────────────────── */
    .search-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      min-width: 0;
      max-width: calc(100% - 96px);
    }
    .search {
      width: 0; /* set by JS */
      min-width: 0;
      max-width: 100%;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--fg);
      font-size: 12px;
      line-height: 16px;
      font-family: inherit;
      text-align: right;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .search::placeholder { color: var(--fg-muted); }
    .search::-webkit-search-cancel-button,
    .search::-webkit-search-decoration { display: none; }
    .search-count {
      font-size: 12px;
      line-height: 16px;
      color: var(--fg-muted);
      white-space: nowrap;
      display: none;
      flex-shrink: 0;
    }
    .search-count.visible { display: block; }

    /* ── Size controls ─────────────────────────────────────── */
    .text-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .toggle-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      color: var(--fg-muted);
      line-height: 1;
      white-space: nowrap;
    }
    .toggle-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    .toggle-btn.active { color: var(--fg); }
    /* ── Sub-toolbar (size and search) ─────────────────────────────────────── */
    .sub-toolbar {
      position: sticky;
      top: var(--site-header-height);
      z-index: 19;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
    }
    @media (max-width: 760px) {
      .sub-toolbar { padding-inline: 12px; }
    }

    /* ── Grid ────────────────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 2px;
      padding: 10px 12px 40px;
    }

    /* ── Icon card ───────────────────────────────────────────────────────── */
    .icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 0;
      cursor: pointer;
      position: relative;
      -webkit-user-select: none;
      user-select: none;
      outline: none;
    }
    .icon-card:hover,
    .icon-card:focus-visible {
      background: var(--divider);
    }
    .icon-card:focus-visible {
      box-shadow: 0 0 0 2px var(--fg);
    }
    .icon-card.copied {
      background: var(--divider);
    }
    .icon-card svg {
      width: var(--icon-size, 24px);
      height: var(--icon-size, 24px);
      color: var(--fg);
      flex-shrink: 0;
    }
    .icon-name {
      font-size: 9px;
      line-height: 1.35;
      color: var(--fg-muted);
      text-align: center;
      word-break: break-all;
      max-width: 80px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Tooltip */
    .icon-card::after {
      content: 'Click for options';
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--fg);
      color: var(--bg);
      font-size: 10px;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 30;
    }
    .icon-card:hover::after { opacity: 1; }
    .icon-card.menu-open::after { opacity: 0; }

    /* ── Icon menu ───────────────────────────────────────────────────────── */
    .icon-menu {
      position: fixed;
      z-index: 200;
      min-width: 200px;
      padding: 4px 0;
      background: var(--bg);
      border: 1px solid var(--divider);
      font-size: 12px;
      line-height: 1;
    }
    .icon-menu-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: none;
      border: none;
      color: var(--fg);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .icon-menu-item:hover,
    .icon-menu-item:focus-visible {
      background: var(--divider);
      outline: none;
    }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 64px 0;
      text-align: center;
      color: var(--fg-muted);
    }
    .empty-state p { font-size: 12px; }
    .empty-state small { font-size: 12px; opacity: 0.7; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--fg);
      color: var(--bg);
      padding: 8px 14px;
      border-radius: 0;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
      white-space: nowrap;
      max-width: calc(100vw - 40px);
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Loading ─────────────────────────────────────────────────────────── */
    .loading {
      grid-column: 1 / -1;
      padding: 64px 0;
      text-align: center;
      color: var(--fg-muted);
      font-size: 12px;
    }
  </style>
  <style>/* @@SITE_CSS@@ */</style>
</head>
<body>

<!-- @@SPRITE@@ -->

<!-- Toolbar -->
<header class="toolbar">
  <span class="logo">@@PACKAGE_LABEL@@</span>
  <div class="primary-nav" id="category-tabs" role="group" aria-label="Icon category"></div>
  <div class="theme-options" role="group" aria-label="Color theme">
    <button class="toggle-btn" data-theme-choice="light" aria-pressed="false">Light</button>
    <button class="toggle-btn" data-theme-choice="dark" aria-pressed="false">Dark</button>
    <button class="toggle-btn" data-theme-choice="system" aria-pressed="false">System</button>
  </div>
</header>

<!-- Sub-toolbar (size controls and right-aligned global search) -->
<div class="sub-toolbar" id="sub-toolbar">
  <div class="text-toggle" role="group" aria-label="Icon size">
    <button class="toggle-btn" data-size="16" aria-pressed="false">16</button>
    <button class="toggle-btn" data-size="24" aria-pressed="false">24</button>
    <button class="toggle-btn" data-size="48" aria-pressed="false">48</button>
  </div>
  <div class="search-wrap">
    <input class="search" type="search" id="search" placeholder=""
      autocomplete="off" spellcheck="false" aria-label="Search icons">
    <span class="search-count" id="search-count" aria-live="polite"></span>
  </div>
</div>

<main>
  <div class="grid" id="grid" role="list">
    <div class="loading">Loading icons…</div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="assertive"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────

let spriteReady = false;
let query = '';
let activeCategory = localStorage.getItem('icomo-category') || 'all';
let iconSize = Number(localStorage.getItem('icomo-size')) || 24;

// Config for the category tabs. The 'all' tab is always first; the rest
// come from the CATEGORIES manifest in the same order as the build.
const TAB_CONFIG = [
  { id: 'all',    label: 'All' },
  { id: 'system', label: 'System' },
  { id: 'flag',   label: 'Flags' },
  { id: 'map',    label: 'Map' },
];

// ── Refs ─────────────────────────────────────────────────────────────────────

const grid          = document.getElementById('grid');
const categoryTabs  = document.getElementById('category-tabs');
const searchEl      = document.getElementById('search');
const searchCount   = document.getElementById('search-count');
const toast         = document.getElementById('toast');

searchEl.placeholder = `Search ${ICONS.length} icons`;

// ── Search width sizer ────────────────────────────────────────────────────────

const searchSizer = document.createElement('span');
searchSizer.setAttribute('aria-hidden', 'true');
searchSizer.style.cssText = 'position:fixed;top:-9999px;visibility:hidden;white-space:pre;font-size:12px;font-family:Inter,system-ui,sans-serif;pointer-events:none;';
document.body.appendChild(searchSizer);

function syncSearchWidth() {
  searchSizer.textContent = searchEl.value || searchEl.placeholder;
  searchEl.style.width = Math.ceil(searchSizer.offsetWidth) + 4 + 'px';
}

syncSearchWidth();

// ── Size toggle ───────────────────────────────────────────────────────────────

function applySize(size) {
  iconSize = size;
  document.documentElement.style.setProperty('--icon-size', size + 'px');
  document.querySelectorAll('.text-toggle[aria-label="Icon size"] .toggle-btn').forEach(btn => {
    const active = Number(btn.dataset.size) === size;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });
}

document.querySelectorAll('.text-toggle[aria-label="Icon size"] .toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    applySize(Number(btn.dataset.size));
    localStorage.setItem('icomo-size', btn.dataset.size);
  });
});

applySize(iconSize);

// ── Search ────────────────────────────────────────────────────────────────────

searchEl.addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  syncSearchWidth();
  // Search spans all categories; keep sizes and search visible in their row.
  renderTabs();
  if (spriteReady) render();
});

// ── Category tabs ────────────────────────────────────────────────────────────

function renderTabs() {
  // Only show tabs for categories that actually have icons
  const tabs = TAB_CONFIG.filter(t => {
    if (t.id === 'all') return true;
    return CATEGORIES[t.id] && CATEGORIES[t.id].count > 0;
  });

  categoryTabs.innerHTML = tabs.map(t => {
    const isActive = !query && t.id === activeCategory;
    return `<button
      class="toggle-btn${isActive ? ' active' : ''}"
      data-category="${t.id}"
      aria-pressed="${isActive}"
    >${t.label}</button>`;
  }).join('');

  categoryTabs.querySelectorAll('[data-category]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.category;
      localStorage.setItem('icomo-category', activeCategory);
      query = '';
      searchEl.value = '';
      syncSearchWidth();
      renderTabs();
      if (spriteReady) render();
    });
  });
}

renderTabs();

// ── Sprite injection ──────────────────────────────────────────────────────────
// Sprite is inlined by build-docs.mjs — see @@SPRITE@@ in <body>
spriteReady = true;
render();

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  // Search is global across categories; when no query, narrow by active tab.
  let filtered;
  if (query) {
    filtered = ICONS.filter(i =>
      i.pascal.toLowerCase().includes(query) ||
      (i.aliases && i.aliases.some(a => a.includes(query)))
    );
  } else if (activeCategory === 'all') {
    filtered = ICONS;
  } else {
    filtered = ICONS.filter(i => i.category === activeCategory);
  }

  if (query) {
    searchCount.textContent = `${filtered.length}/${ICONS.length}`;
    searchCount.classList.add('visible');
  } else {
    searchCount.classList.remove('visible');
  }

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" role="status">
        <p>No icons match &ldquo;${escHtml(query)}&rdquo;</p>
        <small>Try a different search term</small>
      </div>`;
    return;
  }

  // Build fragment to minimise reflows
  const frag = document.createDocumentFragment();

  for (const icon of filtered) {
    const card = document.createElement('div');
    card.className = 'icon-card';
    card.setAttribute('role', 'listitem');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-haspopup', 'menu');
    card.setAttribute('aria-label', `${icon.pascal} — click for options`);

    card.innerHTML = `
      <svg aria-hidden="true" focusable="false" fill="currentColor">
        <use href="#${icon.kebab}"></use>
      </svg>
      <span class="icon-name">${escHtml(icon.pascal)}</span>`;

    card.addEventListener('click', e => {
      e.stopPropagation();
      toggleMenu(icon, card);
    });
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleMenu(icon, card);
      }
    });

    frag.appendChild(card);
  }

  grid.innerHTML = '';
  grid.appendChild(frag);
}

// ── Icon actions menu ─────────────────────────────────────────────────────────

let toastTimer = null;
let activeMenu = null;

function toggleMenu(icon, card) {
  if (activeMenu && activeMenu.card === card) {
    closeMenu();
    return;
  }
  openMenu(icon, card);
}

function openMenu(icon, card) {
  closeMenu();

  const menu = document.createElement('div');
  menu.className = 'icon-menu';
  menu.setAttribute('role', 'menu');

  const themeable = CATEGORIES[icon.category]?.themeable !== false;
  const items = [
    { label: 'Copy import code for React', run: () => copyImport(icon.pascal) },
    ...(themeable
      ? [
          { label: 'Download as PNG in black', run: () => downloadPng(icon, '#000000') },
          { label: 'Download as PNG in white', run: () => downloadPng(icon, '#ffffff') },
        ]
      : [{ label: 'Download as PNG', run: () => downloadPng(icon) }]),
    { label: 'Download as SVG', run: () => downloadSvg(icon) },
  ];

  items.forEach(({ label, run }) => {
    const btn = document.createElement('button');
    btn.className = 'icon-menu-item';
    btn.type = 'button';
    btn.setAttribute('role', 'menuitem');
    btn.textContent = label;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      closeMenu();
      try { run(); } catch (err) { showToast('Error: ' + err.message); }
    });
    menu.appendChild(btn);
  });

  document.body.appendChild(menu);

  // Anchor menu's top-left to the card's bottom-left; flip above on overflow
  const rect = card.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();
  const margin = 8;
  let top = rect.bottom + 6;
  if (top + menuRect.height + margin > window.innerHeight) {
    top = Math.max(margin, rect.top - menuRect.height - 6);
  }
  let left = Math.max(margin, Math.min(rect.left, window.innerWidth - menuRect.width - margin));
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';

  card.classList.add('menu-open');
  activeMenu = { menu, card };

  const firstItem = menu.querySelector('.icon-menu-item');
  if (firstItem) firstItem.focus();
}

function closeMenu() {
  if (!activeMenu) return;
  activeMenu.card.classList.remove('menu-open');
  activeMenu.menu.remove();
  activeMenu = null;
}

document.addEventListener('click', e => {
  if (activeMenu && !activeMenu.menu.contains(e.target)) closeMenu();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && activeMenu) {
    const card = activeMenu.card;
    closeMenu();
    card.focus();
  }
});
window.addEventListener('scroll', closeMenu, true);
window.addEventListener('resize', closeMenu);

// ── Copy import ───────────────────────────────────────────────────────────────

function copyImport(pascal) {
  const text = `import { ${pascal} } from '@ds-mo/icons'`;
  const done = () => showToast(text);
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(el);
  el.select();
  try { document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(el);
  cb();
}

// ── SVG / PNG downloads ───────────────────────────────────────────────────────

function buildStandaloneSvg(icon, { size, color } = {}) {
  const symbol = document.getElementById(icon.kebab);
  if (!symbol) throw new Error(`Missing sprite symbol: ${icon.kebab}`);
  const viewBox = symbol.getAttribute('viewBox') || '0 0 16 16';
  const symFill = symbol.getAttribute('fill') || 'currentColor';
  const serializer = new XMLSerializer();
  let inner = '';
  for (const child of symbol.children) inner += serializer.serializeToString(child);
  const w = size ?? 16;
  const colorAttr = color ? ` color="${color}"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${w}" viewBox="${viewBox}" fill="${symFill}"${colorAttr}>${inner}</svg>`;
}

function downloadSvg(icon) {
  const svg = buildStandaloneSvg(icon);
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  triggerDownload(blob, `${icon.kebab}.svg`);
  showToast(`${icon.kebab}.svg`);
}

function downloadPng(icon, color) {
  const svg = buildStandaloneSvg(icon, { size: 512, color });
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 512, 512);
    URL.revokeObjectURL(url);
    canvas.toBlob(pngBlob => {
      if (!pngBlob) { showToast('Error generating PNG'); return; }
      const suffix = color ? `-${color === '#ffffff' ? 'white' : 'black'}` : '';
      const name = `${icon.kebab}${suffix}.png`;
      triggerDownload(pngBlob, name);
      showToast(name);
    }, 'image/png');
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    showToast('Error generating PNG');
  };
  img.src = url;
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

// ── Util ──────────────────────────────────────────────────────────────────────

function escHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
