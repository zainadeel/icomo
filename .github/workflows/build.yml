name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A healthy run takes a few minutes; fail fast instead of the 6-hour default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Build icons
        run: npm run build

      - name: Test
        run: npm test

      - name: Build docs
        run: npm run build:docs

      - name: Verify dist output
        run: |
          test -f dist/index.mjs
          test -f dist/index.d.ts
          test -f dist/meta.json
          test -f dist/meta.mjs
          test -f dist/meta.d.ts
          test -f dist/agent.json
          test -f dist/agent.mjs
          test -f dist/agent.d.ts
          test -f dist/sprite.svg
          COUNT=$(node -e 'console.log(require("./dist/meta.json").count)')
          SYSTEM=$(node -e 'console.log(require("./dist/meta.json").categories.system.count)')
          FLAG=$(node -e 'console.log(require("./dist/meta.json").categories.flag.count)')
          echo "Built $COUNT icons (system: $SYSTEM, flag: $FLAG)"

      - name: Check for uncommitted src changes
        run: |
          if ! git diff --quiet src/; then
            echo "::error::Build produced changes in src/ — ensure source is stable"
            git diff src/
            exit 1
          fi
